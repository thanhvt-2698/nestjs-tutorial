services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nestjs_tutorial
      POSTGRES_PASSWORD: nestjs
      POSTGRES_USER: nestjs
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjs -d nestjs_tutorial']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro

volumes:
  postgres_data:
